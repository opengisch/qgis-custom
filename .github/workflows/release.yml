# Publishes the last build of a version on main as the release <version>-<tag> of this repo, and tags its Docker
# image <version>-<tag>. Run it by hand: Actions → release → Run workflow. It also tags the composed commit in
# opengisch/QGIS, so that the commit stays when the branch of the version moves on.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, a file of versions/
        type: choice
        options:
          - qgis-dmav
      tag:
        description: The release is named <version>-<tag>, for example qgis-dmav-1 for the tag 1
        type: string
        required: true

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      NAME: ${{ inputs.version }}-${{ inputs.tag }}
    steps:
      - name: Find the last build of the version on main
        id: build
        run: |
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" != 0 ]; then
            echo "::error::A build of main is still running: release when it is done"
            exit 1
          fi
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=qgis-custom-$VERSION-win64" --jq \
            '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0] // empty
             | "\(.workflow_run.id) \(.workflow_run.head_sha)"')
          if [ -z "$build" ]; then
            echo "::error::No build of $VERSION on main: push to main, or run the workflow build"
            exit 1
          fi
          read -r run sha <<< "$build"
          echo "Releasing the build of run $run, at commit $sha"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qgis-custom-${{ inputs.version }}-win64
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: dist

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the image of the build
        run: |
          composed=$(sed -n 's/^Composed: //p' "dist/$VERSION.md")
          if ! docker buildx imagetools inspect "$IMAGE:$composed" > /dev/null; then
            echo "::error::The build has no image $IMAGE:$composed: run the workflow build again"
            exit 1
          fi
          echo "COMPOSED=$composed" >> "$GITHUB_ENV"

      # Before the tags: a release that exists already stops the run before it changes anything.
      # The tag goes on main, not on the commit of the build: GITHUB_TOKEN may not tag a commit whose workflows
      # differ from those of main.
      - name: Publish the release
        run: |
          mv dist/*-win64.zip "qgis-custom-$NAME-win64.zip"
          gh release create "$NAME" "qgis-custom-$NAME-win64.zip" --repo "$GITHUB_REPOSITORY" \
            --title "$NAME" --notes-file "dist/$VERSION.md"

      - name: Tag the composed commit in opengisch/QGIS
        env:
          GH_TOKEN: ${{ secrets.QGIS_FORK_TOKEN }}
        run: |
          gh api repos/opengisch/QGIS/git/refs -f "ref=refs/tags/qgis-custom/$NAME" -f "sha=$COMPOSED"

      - name: Tag the image
        run: docker buildx imagetools create --tag "$IMAGE:$NAME" "$IMAGE:$COMPOSED"
