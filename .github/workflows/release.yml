# Publishes the last build of a version on main as the release <version>-<tag> of this repo.
# Run it by hand: Actions → release → Run workflow. It also tags the composed commit in opengisch/QGIS, so that the
# commit stays when the branch of the version moves on.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, a file of versions/
        type: choice
        options:
          - qgis-dmav
      tag:
        description: The release is named <version>-<tag>
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      NAME: ${{ inputs.version }}-${{ inputs.tag }}
    steps:
      - name: Find the last build of the version on main
        id: build
        run: |
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=qgis-custom-$VERSION-win64" --jq \
            '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0] // empty
             | "\(.workflow_run.id) \(.workflow_run.head_sha)"')
          if [ -z "$build" ]; then
            echo "::error::No build of $VERSION on main: push to main, or run the workflow build"
            exit 1
          fi
          read -r run sha <<< "$build"
          echo "Releasing the build of run $run, at commit $sha"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qgis-custom-${{ inputs.version }}-win64
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: dist

      - name: Tag the composed commit in opengisch/QGIS
        env:
          GH_TOKEN: ${{ secrets.QGIS_FORK_TOKEN }}
        run: |
          gh api repos/opengisch/QGIS/git/refs -f "ref=refs/tags/qgis-custom/$NAME" \
            -f "sha=$(sed -n 's/^Composed: //p' "dist/$VERSION.md")"

      - name: Publish the release
        env:
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          mv dist/*-win64.zip "qgis-custom-$NAME-win64.zip"
          gh release create "$NAME" "qgis-custom-$NAME-win64.zip" --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "$NAME" --notes-file "dist/$VERSION.md"
