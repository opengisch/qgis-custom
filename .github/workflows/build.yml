# Composes the versions of versions/ and builds them for Windows and as a Docker image.
# A pull request checks that every version composes. A push to main, or a run by hand (Actions → build → Run
# workflow), also pushes each version to opengisch/QGIS and builds it; the workflow release publishes such a build.
# The job windows mirrors .github/workflows/windows-qt6.yml of qgis/QGIS at 19a6ceae62d32d255f480821f60b2701ed236c73.
name: build

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - .github/workflows/release.yml
      - .github/workflows/follow.yml
  workflow_dispatch:

# Builds on main wait for each other: a build takes hours, and a newer one does not cancel it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  compose:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.compose.outputs.versions }}
      shas: ${{ steps.compose.outputs.shas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose every version
        id: compose
        run: |
          for version in versions/*.toml; do
            python3 compose.py "$(basename "$version" .toml)"
          done
          git -C work/QGIS for-each-ref --format='%(refname:lstrip=3) %(objectname)' refs/heads/qgis-custom/ \
            | jq -Rn '[inputs | split(" ") | {key: .[0], value: .[1]}] | from_entries' > shas.json
          echo "versions=$(jq -c keys shas.json)" >> "$GITHUB_OUTPUT"
          echo "shas=$(jq -c . shas.json)" >> "$GITHUB_OUTPUT"

      - name: Push to opengisch/QGIS
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.QGIS_FORK_TOKEN }}
        run: |
          git -C work/QGIS push "https://x-access-token:$TOKEN@github.com/opengisch/QGIS.git" \
            "+refs/heads/qgis-custom/*:refs/heads/qgis-custom/*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: manifests
          path: work/*.md

  docker:
    needs: compose
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.compose.outputs.versions) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ fromJSON(needs.compose.outputs.shas)[matrix.version] }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The attempt is in the key: a re-run saves what it compiled too
      - id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: docker-ccache-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docker-ccache-${{ matrix.version }}-
            docker-ccache-

      # The ccache goes in and out of the cache mount of the Dockerfile through builds of its own. It comes out, and is
      # saved, even when the build or the test fails: the next build goes on from what compiled.
      - id: inject
        name: Put the ccache in the cache mount
        run: |
          mkdir -p ccache
          docker buildx build -f - ccache <<'EOF'
          FROM ubuntu:resolute
          RUN --mount=type=cache,id=ccache,target=/root/.ccache --mount=target=/ccache cp -a /ccache/. /root/.ccache/
          EOF

      # Loaded, and pushed once tested. The tag of the composed commit is the one the workflow release finds the image
      # of a build by.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: qgis_ref=${{ env.SHA }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.version }}
            ${{ env.IMAGE }}:${{ env.SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}

      # The desktop starts with the core plugins, which need the Python modules of the image, and with the SVG icons
      - name: Test the desktop
        timeout-minutes: 10
        run: |
          cat > test.py <<'EOF'
          import qgis.utils
          from qgis.core import Qgis, QgsApplication
          from qgis.PyQt.QtCore import QTimer
          from qgis.PyQt.QtGui import QImageReader

          def check():
              missing = {"MetaSearch", "db_manager", "processing"} - set(qgis.utils.active_plugins)
              svg = b"svg" in [bytes(f) for f in QImageReader.supportedImageFormats()]
              print(f"QGIS {Qgis.version()}, GEOS {Qgis.geosVersion()}, plugins not loaded: {sorted(missing)}, SVG: {svg}", flush=True)
              QgsApplication.exit(0 if svg and not missing else 1)

          QTimer.singleShot(3000, check)
          EOF
          docker run --rm -v "$PWD/test.py:/test.py:ro" "$IMAGE:$SHA" xvfb-run -a qgis --nologo --code /test.py

      # Just before the push: ghcr refused the push of a login made before a build of hours
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push --all-tags "$IMAGE"

      - id: extract
        name: Take the ccache out of the cache mount
        if: always() && steps.inject.outcome == 'success'
        run: |
          rm -rf ccache && mkdir ccache
          docker buildx build -f - --output type=local,dest=ccache ccache <<'EOF'
          FROM ubuntu:resolute AS ccache
          RUN --mount=type=cache,id=ccache,target=/root/.ccache cp -a /root/.ccache /out
          FROM scratch
          COPY --from=ccache /out /
          EOF

      - if: always() && steps.extract.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  windows:
    needs: compose
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.compose.outputs.versions) }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengisch/QGIS
          ref: ${{ fromJSON(needs.compose.outputs.shas)[matrix.version] }}
          fetch-depth: 2
          persist-credentials: false

      - name: 🔨 Uninstall system cmake
        shell: bash
        run: |
          choco uninstall cmake.install

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9
        with:
          cmakeVersion: 3.31.6

      - name: 🧽 Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 #v1

      - name: 🎡 Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: 🦬 Setup flex/bison
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f #v1.13
        with:
          repository: 'lexxmark/winflexbison'
          fileName: '*.zip'
          tag: 'v2.5.24'
          extract: true

      - name: 🛍️ Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d #v1.2
        with:
          max-size: 1G
          key: build-ccache-win64-qt6-qgis-custom

      - name: 🛍️ Tune ccache configuration
        shell: bash
        run: |
          # To make ccache work properly with precompiled headers
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime

      - name: 🌋 Install dependencies and build
        # Stops before the 6 h job limit, so the post step of ccache saves the cache: re-run the job to go on
        timeout-minutes: 330
        shell: bash
        env:
          X_VCPKG_ASSET_SOURCES: x-azurl,https://assetcache.open-vcpkg.org/assetcache,,read
          # Reads the vcpkg binary cache of qgis/QGIS; its refusal of our uploads is only a warning
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DIR=$( cygpath "${{ github.workspace }}/build" )
          SOURCE_DIR=$( cygpath "${{ github.workspace }}" )

          cmake -S "${SOURCE_DIR}" \
                -B "${BUILD_DIR}" \
                -G Ninja \
                -D CMAKE_BUILD_TYPE=Release \
                -D WITH_VCPKG=ON \
                -D CREATE_ZIP=ON \
                -D VCPKG_TARGET_TRIPLET=x64-windows-release \
                -D VCPKG_HOST_TRIPLET=x64-windows-release \
                -D WITH_DESKTOP=ON \
                -D WITH_3D=ON \
                -D WITH_BINDINGS=ON \
                -D WITH_GEOGRAPHICLIB=OFF \
                -D WITH_SFCGAL=ON \
                -D ENABLE_TESTS=OFF \
                -D USE_CCACHE=ON \
                -D ENABLE_UNITY_BUILDS=OFF \
                -D FLEX_EXECUTABLE="${SOURCE_DIR}/win_flex.exe" \
                -D BISON_EXECUTABLE="${SOURCE_DIR}/win_bison.exe" \
                -D WITH_QTWEBENGINE=OFF \
                -D VCPKG_INSTALL_OPTIONS="--x-buildtrees-root=C:/src" \
                -D "NUGET_USERNAME=${GITHUB_ACTOR}" \
                -D "NUGET_TOKEN=${NUGET_TOKEN}"

          cmake --build "${BUILD_DIR}" --config Release

      - name: 📦 Package
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --target bundle --config Release

      - name: 📑 Upload dep build logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: build-logs-${{ matrix.version }}
          path: |
            C:/src/**/*.log

      - name: 📤 Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qgis-custom-${{ matrix.version }}-win64
          path: build/*-win64.zip
