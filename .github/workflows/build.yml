# Composes the versions of versions/ and builds them for Windows.
# A pull request checks that every version composes. A push to main, or a run by hand (Actions → build → Run
# workflow), also pushes each version to opengisch/QGIS and builds it; the workflow release publishes such a build.
# The build job mirrors .github/workflows/windows-qt6.yml of qgis/QGIS at 19a6ceae62d32d255f480821f60b2701ed236c73.
name: build

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

# Builds on main wait for each other: a build takes hours, and a newer one does not cancel it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  compose:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.compose.outputs.versions }}
      shas: ${{ steps.compose.outputs.shas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose every version
        id: compose
        run: |
          for version in versions/*.toml; do
            python3 compose.py "$(basename "$version" .toml)"
          done
          git -C work/QGIS for-each-ref --format='%(refname:lstrip=3) %(objectname)' refs/heads/qgis-custom/ \
            | jq -Rn '[inputs | split(" ") | {key: .[0], value: .[1]}] | from_entries' > shas.json
          echo "versions=$(jq -c keys shas.json)" >> "$GITHUB_OUTPUT"
          echo "shas=$(jq -c . shas.json)" >> "$GITHUB_OUTPUT"

      - name: Push to opengisch/QGIS
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.QGIS_FORK_TOKEN }}
        run: |
          git -C work/QGIS push "https://x-access-token:$TOKEN@github.com/opengisch/QGIS.git" \
            "+refs/heads/qgis-custom/*:refs/heads/qgis-custom/*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: manifests
          path: work/*.md

  build:
    needs: compose
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.compose.outputs.versions) }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengisch/QGIS
          ref: ${{ fromJSON(needs.compose.outputs.shas)[matrix.version] }}
          fetch-depth: 2
          persist-credentials: false

      - name: 🔨 Uninstall system cmake
        shell: bash
        run: |
          choco uninstall cmake.install

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9
        with:
          cmakeVersion: 3.31.6

      - name: 🧽 Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 #v1

      - name: 🎡 Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: 🦬 Setup flex/bison
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f #v1.13
        with:
          repository: 'lexxmark/winflexbison'
          fileName: '*.zip'
          tag: 'v2.5.24'
          extract: true

      - name: 🛍️ Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d #v1.2
        with:
          max-size: 1G
          key: build-ccache-win64-qt6-qgis-custom

      - name: 🛍️ Tune ccache configuration
        shell: bash
        run: |
          # To make ccache work properly with precompiled headers
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime

      - name: 🌋 Install dependencies and build
        # Stops before the 6 h job limit, so the post step of ccache saves the cache: re-run the job to go on
        timeout-minutes: 330
        shell: bash
        env:
          X_VCPKG_ASSET_SOURCES: x-azurl,https://assetcache.open-vcpkg.org/assetcache,,read
          # Reads the vcpkg binary cache of qgis/QGIS; its refusal of our uploads is only a warning
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DIR=$( cygpath "${{ github.workspace }}/build" )
          SOURCE_DIR=$( cygpath "${{ github.workspace }}" )

          cmake -S "${SOURCE_DIR}" \
                -B "${BUILD_DIR}" \
                -G Ninja \
                -D CMAKE_BUILD_TYPE=Release \
                -D WITH_VCPKG=ON \
                -D CREATE_ZIP=ON \
                -D VCPKG_TARGET_TRIPLET=x64-windows-release \
                -D VCPKG_HOST_TRIPLET=x64-windows-release \
                -D WITH_DESKTOP=ON \
                -D WITH_3D=ON \
                -D WITH_BINDINGS=ON \
                -D WITH_GEOGRAPHICLIB=OFF \
                -D WITH_SFCGAL=ON \
                -D ENABLE_TESTS=OFF \
                -D USE_CCACHE=ON \
                -D ENABLE_UNITY_BUILDS=OFF \
                -D FLEX_EXECUTABLE="${SOURCE_DIR}/win_flex.exe" \
                -D BISON_EXECUTABLE="${SOURCE_DIR}/win_bison.exe" \
                -D WITH_QTWEBENGINE=OFF \
                -D VCPKG_INSTALL_OPTIONS="--x-buildtrees-root=C:/src" \
                -D "NUGET_USERNAME=${GITHUB_ACTOR}" \
                -D "NUGET_TOKEN=${NUGET_TOKEN}"

          cmake --build "${BUILD_DIR}" --config Release

      - name: 📦 Package
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --target bundle --config Release

      - name: 📑 Upload dep build logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: build-logs-${{ matrix.version }}
          path: |
            C:/src/**/*.log

      - name: 📤 Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qgis-custom-${{ matrix.version }}-win64
          path: build/*-win64.zip
